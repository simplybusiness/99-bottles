version: 2
registries:
  bnw-registry:
    type: rubygems-server
    url: https://bnw-registry.simplybusiness.io
    username: ${{secrets.BNW_REGISTRY_USERNAME}}
    password: ${{secrets.BNW_REGISTRY_PASSWORD}}
  github-octocat:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.X_BOT_ORG_REPO_ONLY_TOKEN}}
updates:
  - package-ecosystem: bundler
    directory: /
    insecure-external-code-execution: allow
    registries:
      - bnw-registry
      - github-octocat
    schedule:
      interval: daily
      time: "07:30"
      timezone: "Europe/London"
    rebase-strategy: disabled
    open-pull-requests-limit: 99
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 5
    groups:
      aws-sdk:
        patterns:
          - "aws-sdk-*"
      opentelemetry:
        patterns:
          - "opentelemetry-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 5
